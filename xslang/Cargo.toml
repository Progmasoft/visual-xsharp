[package]
name = "xslang"
version = "0.3.1"
edition = "2024"
authors = ["Progmasoft <support@progmasoft.com>"]
description = "Retained semantic-analysis experiments for the Visual X# compiler"
license = "MPL-2.0"
repository = "https://github.com/Progmasoft/visual-xsharp"
homepage = "https://github.com/Progmasoft/visual-xsharp"
readme = "README.md"
exclude = ["target/"]

[lib]
name = "xslang"
path = "sources/lib.rs"
crate-type = ["rlib"]
bench = false

[dependencies]
bit-set = "0.11"
indexmap = "2.14"
petgraph = "0.8"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
# `pedantic` and `nursery` are opt-in suggestion collections rather than a
# stable warning contract. Enable individual checks from them once the IR
# APIs and the project's 1000-line modularity policy can satisfy the check
# without obscuring compiler code.
pedantic = "allow"
nursery = "allow"
