[package]
name = "xslang"
version = "0.3.1"
edition = "2024"
build = "build.rs"
authors = ["Progmasoft <support@progmasoft.com>"]
description = "Target-independent semantic analysis and IR core for the Visual X# compiler"
license = "MPL-2.0"
repository = "https://github.com/Progmasoft/visual-xsharp"
homepage = "https://github.com/Progmasoft/visual-xsharp"
readme = "README.md"
documentation = "https://docs.rs/xslang"
keywords = ["compiler", "xsharp", "compiler-ir", "xlil"]
categories = ["compilers"]
exclude = ["target/"]

[features]
default = []
proc-macros = ["dep:xslang-proc-macros"]

[lib]
name = "xslang"
path = "sources/lib.rs"
crate-type = ["rlib", "staticlib"]
bench = false

[dependencies]
bit-set = "0.11"
indexmap = "2.14"
rustc-hash = "2"
smallvec = "1.15"
arrayvec = "0.7"
miette = { version = "7.6", features = ["fancy", "derive"] }
ariadne = "0.6"
parking_lot = "0.12"
petgraph = "0.8"
thiserror = "2.0"
typed-arena = "2.0"
bitflags = "2.13"
camino = "1.2"
lasso = "0.7"
cxx = "1.0"
xslang-proc-macros = { version = "=0.3.1", path = "proc-macros/xlil-create", optional = true }

[build-dependencies]
cxx-build = "1.0"

[dev-dependencies]
proptest = "1.11"
insta = "1.48"
criterion = "0.8"
libfuzzer-sys = "0.4"

[package.metadata.vxs]
component = "compiler-core"
syntax-abi-version = 1
xhir-version = 1
xmir-version = 1
xlil-version = 1

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
# `pedantic` and `nursery` are opt-in suggestion collections rather than a
# stable warning contract. Enable individual checks from them once the IR
# APIs and the project's 1000-line modularity policy can satisfy the check
# without obscuring compiler code.
pedantic = "allow"
nursery = "allow"
