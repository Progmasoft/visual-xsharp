[workspace]
members = ["xlil-create"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
authors = ["Progmasoft <support@progmasoft.com>"]
license = "MPL-2.0"
repository = "https://github.com/Progmasoft/visual-xsharp"

[workspace.dependencies]
proc-macro-crate = "3.4"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "allow"
nursery = "allow"
