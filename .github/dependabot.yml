version: 2
updates:
  - package-ecosystem: gomod
    directory: /helpers
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: bazel
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directories:
      - /ProjectSystem
      - /Analyzer
      - /Formatter
      - /Linter
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /Analyzer/vscode
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The type definitions must not be newer than the Node.js runtime the
      # extension runs on: the VS Code versions it supports and the Node.js
      # version CI uses. A major update is made by hand together with those.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

