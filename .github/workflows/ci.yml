name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Windows ClangCL
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Enter Visual Studio 2026 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust nightly
        shell: pwsh
        run: rustup toolchain install nightly-2026-07-10 --profile minimal

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          clang-cl --version
          lld-link --version
          java --version
          kotlin -version

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install native dependencies
        shell: pwsh
        timeout-minutes: 15
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-binary-cache
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet x64-windows `
            --x-manifest-root "$env:GITHUB_WORKSPACE"

      - name: Configure debug build
        shell: pwsh
        run: |
          cmake --preset clangcl-debug `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DLLVM_DIR="C:/Program Files/LLVM/lib/cmake/llvm"

      - name: Build debug configuration
        shell: pwsh
        run: cmake --build --preset clangcl-debug --parallel 4

      - name: Test debug configuration
        shell: pwsh
        run: ctest --preset clangcl-debug --output-on-failure --parallel 2

      - name: Configure sanitizer build
        shell: pwsh
        run: |
          cmake --preset clangcl-sanitize `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DLLVM_DIR="C:/Program Files/LLVM/lib/cmake/llvm"

      - name: Build sanitizer configuration
        shell: pwsh
        run: cmake --build --preset clangcl-sanitize --parallel 4

      - name: Test sanitizer configuration
        shell: pwsh
        run: ctest --preset clangcl-sanitize --output-on-failure --parallel 2

  languages:
    name: Language layers
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Install Rust nightly
        shell: pwsh
        run: rustup toolchain install nightly-2026-07-10 --profile default

      - name: Test Kotlin project runtime
        shell: pwsh
        run: .\xs_kts\gradlew.bat -p xs_kts test

      - name: Build Haskell compiler layers
        shell: pwsh
        working-directory: xs
        run: cabal build all

      - name: Check Haskell package metadata
        shell: pwsh
        working-directory: xs/haskell/visual-xsharp-compiler
        run: cabal check

      - name: Check Rust formatting
        shell: pwsh
        run: cargo +nightly-2026-07-10 fmt --manifest-path xslang/Cargo.toml --check

      - name: Test Rust compiler core
        shell: pwsh
        run: cargo +nightly-2026-07-10 test --manifest-path xslang/Cargo.toml

      - name: Check Rust lints
        shell: pwsh
        run: cargo +nightly-2026-07-10 clippy --manifest-path xslang/Cargo.toml -- -D warnings

      - name: Check patch hygiene
        shell: pwsh
        run: git diff --check
