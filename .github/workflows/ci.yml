name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Windows ClangCL
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Enter Visual Studio 2026 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust nightly
        shell: pwsh
        run: rustup toolchain install nightly-2026-07-10 --profile minimal

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Restore LLVM development package
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\llvm-dev-22.1.6
          key: llvm-dev-22.1.6-x86_64-windows-msvc

      - name: Install LLVM development package
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TOOL_CACHE "llvm-dev-22.1.6"
          $llvmConfig = Join-Path $llvmRoot "lib\cmake\llvm\LLVMConfig.cmake"
          if (-not (Test-Path $llvmConfig)) {
            New-Item -ItemType Directory -Force $llvmRoot | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "llvm-dev.tar.xz"
            curl.exe -L --fail --retry 4 --retry-delay 5 `
              -o $archive `
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/clang%2Bllvm-22.1.6-x86_64-pc-windows-msvc.tar.xz"
            tar.exe -xf $archive -C $llvmRoot --strip-components=1
          }
          if (-not (Test-Path $llvmConfig)) {
            throw "The official LLVM development archive does not contain LLVMConfig.cmake"
          }
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LLVM_DIR=$([System.IO.Path]::GetDirectoryName($llvmConfig))" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          clang-cl --version
          lld-link --version
          java --version
          kotlin -version
          if (-not (Test-Path (Join-Path $env:LLVM_DIR "LLVMConfig.cmake"))) {
            throw "LLVMConfig.cmake was not activated from the development package"
          }

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install native dependencies
        shell: pwsh
        timeout-minutes: 15
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-binary-cache
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet x64-windows `
            --x-manifest-root "$env:GITHUB_WORKSPACE"

      - name: Configure debug build
        shell: pwsh
        run: |
          cmake --preset clangcl-debug `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DLLVM_DIR="$env:LLVM_DIR"

      - name: Build debug configuration
        shell: pwsh
        run: cmake --build --preset clangcl-debug --parallel 4

      - name: Test debug configuration
        shell: pwsh
        run: ctest --preset clangcl-debug --output-on-failure --parallel 2

      - name: Configure sanitizer build
        shell: pwsh
        run: |
          cmake --preset clangcl-sanitize `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DLLVM_DIR="$env:LLVM_DIR"

      - name: Build sanitizer configuration
        shell: pwsh
        run: cmake --build --preset clangcl-sanitize --parallel 4

      - name: Test sanitizer configuration
        shell: pwsh
        run: ctest --preset clangcl-sanitize --output-on-failure --parallel 2

  languages:
    name: Language layers
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Install Rust nightly
        shell: pwsh
        run: rustup toolchain install nightly-2026-07-10 --profile default

      - name: Check Kotlin project runtime
        shell: pwsh
        run: .\xs_kts\gradlew.bat -p xs_kts check

      - name: Build Haskell compiler layers
        shell: pwsh
        working-directory: xs
        run: cabal build all

      - name: Test Haskell compiler layers
        shell: pwsh
        working-directory: xs
        run: cabal test all

      - name: Check Haskell package metadata
        shell: pwsh
        working-directory: xs/haskell/visual-xsharp-compiler
        run: cabal check

      - name: Check Rust formatting
        shell: pwsh
        run: cargo +nightly-2026-07-10 fmt --manifest-path xslang/Cargo.toml --check

      - name: Test Rust compiler core
        shell: pwsh
        run: cargo +nightly-2026-07-10 test --manifest-path xslang/Cargo.toml

      - name: Check Rust lints
        shell: pwsh
        run: cargo +nightly-2026-07-10 clippy --manifest-path xslang/Cargo.toml -- -D warnings

      - name: Check patch hygiene
        shell: pwsh
        run: git diff --check

  coverage:
    name: Haskell frontend coverage
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Test Haskell frontend with HPC
        shell: pwsh
        working-directory: xs
        run: cabal test all --enable-coverage --test-show-details=direct

      - name: Convert HPC data to LCOV
        shell: pwsh
        working-directory: xs
        run: |
          $toolVersion = "0.6.4.1"
          $expectedHash = "9805651928db5c168a453ae09dd26113c7fc9816314b7268f1d1a71f7196f55f"
          $tool = Join-Path $env:RUNNER_TEMP "hpc-codecov-$toolVersion.exe"
          $reportDirectory = Join-Path $PWD "coverage"
          $report = Join-Path $reportDirectory "haskell-frontend.lcov"

          curl.exe -L --fail --retry 4 --retry-delay 3 `
            -o $tool `
            "https://github.com/8c6794b6/hpc-codecov/releases/download/v$toolVersion/hpc-codecov-Windows-X64.exe"

          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tool).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "hpc-codecov SHA-256 mismatch: $actualHash"
          }

          New-Item -ItemType Directory -Force $reportDirectory | Out-Null
          & $tool -r . -x Main -x SourceSetTests -f lcov -o $report cabal:compiler-layer-tests
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $report)) {
            throw "hpc-codecov did not produce the expected LCOV report"
          }

      - name: Upload Haskell frontend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          plugins: noop
          files: ./xs/coverage/haskell-frontend.lcov
          flags: haskell-frontend
          name: haskell-frontend
