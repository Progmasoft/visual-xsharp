name: Native

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-clangcl:
    name: Windows ClangCL
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: native-windows-clangcl
          repository-cache: true

      - name: Enter Visual Studio 2026 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore LLVM development package
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\llvm-dev-22.1.6
          key: llvm-dev-22.1.6-x86_64-windows-msvc

      - name: Install LLVM development package
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TOOL_CACHE "llvm-dev-22.1.6"
          $llvmConfig = Join-Path $llvmRoot "lib\cmake\llvm\LLVMConfig.cmake"
          if (-not (Test-Path $llvmConfig)) {
            New-Item -ItemType Directory -Force $llvmRoot | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "llvm-dev.tar.xz"
            curl.exe -L --fail --retry 4 --retry-delay 5 `
              -o $archive `
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/clang%2Bllvm-22.1.6-x86_64-pc-windows-msvc.tar.xz"
            tar.exe -xf $archive -C $llvmRoot --strip-components=1
          }
          if (-not (Test-Path $llvmConfig)) {
            throw "The official LLVM development archive does not contain LLVMConfig.cmake"
          }
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LLVM_DIR=$([System.IO.Path]::GetDirectoryName($llvmConfig))" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          bazel --version
          clang-cl --version
          lld-link --version
          if (-not (Test-Path (Join-Path $env:LLVM_DIR "LLVMConfig.cmake"))) {
            throw "LLVMConfig.cmake was not activated from the development package"
          }

      - name: Build native compiler
        shell: pwsh
        run: bazel build //Compiler/Cli:vxs

      - name: Test native compiler
        shell: pwsh
        run: |
          bazel build //tests:cli_parser_tests
          & .\bazel-bin\tests\cli_parser_tests.exe
