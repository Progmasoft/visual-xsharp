name: Native

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-clangcl:
    name: Windows ClangCL
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: native-windows-clangcl
          repository-cache: true

      - name: Enter Visual Studio 2026 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore LLVM development package
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\llvm-dev-22.1.6
          key: llvm-dev-22.1.6-x86_64-windows-msvc

      - name: Install LLVM development package
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TOOL_CACHE "llvm-dev-22.1.6"
          $llvmConfig = Join-Path $llvmRoot "bin\llvm-config.exe"
          if (-not (Test-Path $llvmConfig)) {
            New-Item -ItemType Directory -Force $llvmRoot | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "llvm-dev.tar.xz"
            curl.exe -L --fail --retry 4 --retry-delay 5 `
              -o $archive `
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/clang%2Bllvm-22.1.6-x86_64-pc-windows-msvc.tar.xz"
            tar.exe -xf $archive -C $llvmRoot --strip-components=1
          }
          if (-not (Test-Path $llvmConfig)) {
            throw "The official LLVM development archive does not contain llvm-config.exe"
          }
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          bazel --version
          clang-cl --version
          lld-link --version
          llvm-config --version

      - name: Test repository Go helpers
        shell: pwsh
        run: |
          go test scripts/develop.go scripts/develop_test.go
          go test scripts/githelper.go scripts/githelper_test.go

      - name: Verify project C and C++ formatting
        shell: pwsh
        run: |
          $wheel = Join-Path $env:RUNNER_TEMP "clang_format-23.1.0-py2.py3-none-win_amd64.whl"
          curl.exe -L --fail --retry 4 --retry-delay 3 `
            -o $wheel `
            "https://files.pythonhosted.org/packages/95/19/501001c2aa10dff69eb3ec3802851abafbdd3adeb06db152fef553b5ef00/clang_format-23.1.0-py2.py3-none-win_amd64.whl"

          $expectedHash = "c10a99dc55a5630bbf6135f004e057d1a3153e4f54cda3f67e0c0b5a150d1cdd"
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "clang-format wheel SHA-256 mismatch: $actualHash"
          }

          python -m pip install --disable-pip-version-check --no-deps $wheel
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install the pinned clang-format wheel"
          }

          $formatter = python -c "import clang_format; print(clang_format.get_executable('clang-format'))"
          & $formatter --version
          $files = @(git ls-files -- '*.cpp' '*.hpp' '*.hh' '*.h' ':!third_party/**')
          if ($files.Count -eq 0) {
            throw "No project-owned C or C++ files were selected for formatting"
          }
          & $formatter --dry-run --Werror --style=file @files
          if ($LASTEXITCODE -ne 0) {
            throw "Project-owned C or C++ files are not formatted"
          }

      - name: Build native compiler
        shell: pwsh
        run: go run scripts/develop.go doctor

      - name: Test native compiler
        shell: pwsh
        run: go run scripts/develop.go test

  macos-clang:
    name: ${{ matrix.name }} Clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Sequoia
            runner: macos-15
            sanitizer: address
          - name: macOS Tahoe
            runner: macos-26
            sanitizer: undefined
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: native-${{ matrix.runner }}-clang
          repository-cache: true

      - name: Install LLVM development package
        shell: bash
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          llvm_root="$(brew --prefix llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          echo "$llvm_root/bin" >> "$GITHUB_PATH"

      - name: Verify macOS toolchain
        shell: bash
        run: go run scripts/develop.go doctor

      - name: Test repository Go helpers
        shell: bash
        run: |
          go test scripts/develop.go scripts/develop_test.go
          go test scripts/githelper.go scripts/githelper_test.go

      - name: Test native compiler
        shell: bash
        run: go run scripts/develop.go test

      - name: Test native compiler with ${{ matrix.sanitizer }} sanitizer
        shell: bash
        run: go run scripts/develop.go sanitize ${{ matrix.sanitizer }}
