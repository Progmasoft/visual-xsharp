name: Native

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-clangcl:
    name: Windows ClangCL
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Enter Visual Studio 2026 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust nightly
        shell: pwsh
        run: rustup toolchain install nightly-2026-07-10 --profile minimal

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Restore LLVM development package
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\llvm-dev-22.1.6
          key: llvm-dev-22.1.6-x86_64-windows-msvc

      - name: Install LLVM development package
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TOOL_CACHE "llvm-dev-22.1.6"
          $llvmConfig = Join-Path $llvmRoot "lib\cmake\llvm\LLVMConfig.cmake"
          if (-not (Test-Path $llvmConfig)) {
            New-Item -ItemType Directory -Force $llvmRoot | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "llvm-dev.tar.xz"
            curl.exe -L --fail --retry 4 --retry-delay 5 `
              -o $archive `
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/clang%2Bllvm-22.1.6-x86_64-pc-windows-msvc.tar.xz"
            tar.exe -xf $archive -C $llvmRoot --strip-components=1
          }
          if (-not (Test-Path $llvmConfig)) {
            throw "The official LLVM development archive does not contain LLVMConfig.cmake"
          }
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LLVM_DIR=$([System.IO.Path]::GetDirectoryName($llvmConfig))" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          clang-cl --version
          lld-link --version
          java --version
          kotlin -version
          if (-not (Test-Path (Join-Path $env:LLVM_DIR "LLVMConfig.cmake"))) {
            throw "LLVMConfig.cmake was not activated from the development package"
          }

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install native dependencies
        shell: pwsh
        timeout-minutes: 15
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-binary-cache
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet x64-windows `
            --x-manifest-root "$env:GITHUB_WORKSPACE"

      - name: Configure debug build
        shell: pwsh
        run: |
          cmake --preset clangcl-debug `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DLLVM_DIR="$env:LLVM_DIR"

      - name: Build debug configuration
        shell: pwsh
        run: cmake --build --preset clangcl-debug --parallel 4

      - name: Test debug configuration
        shell: pwsh
        run: ctest --preset clangcl-debug --output-on-failure --parallel 2

      - name: Configure sanitizer build
        shell: pwsh
        run: |
          cmake --preset clangcl-sanitize `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DLLVM_DIR="$env:LLVM_DIR"

      - name: Build sanitizer configuration
        shell: pwsh
        run: cmake --build --preset clangcl-sanitize --parallel 4

      - name: Test sanitizer configuration
        shell: pwsh
        run: ctest --preset clangcl-sanitize --output-on-failure --parallel 2
