name: Formatter

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: visual-formatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatter:
    name: Kotlin DSL and formatter
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.6.1"

      - name: Check formatter configuration DSL
        shell: pwsh
        run: .\ProjectSystem\gradlew.bat -p Formatter spotlessCheck test

      - name: Build Visual Formatter
        shell: pwsh
        working-directory: Compiler
        run: cabal build visual-formatter

      - name: Test Visual Formatter
        shell: pwsh
        working-directory: Compiler
        run: cabal test visual-formatter-tests

      - name: Check package metadata
        shell: pwsh
        working-directory: Formatter
        run: cabal check

      - name: Check patch hygiene
        shell: pwsh
        run: git diff --check
