name: Visual Analyzer

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: visual-analyzer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyzer:
    name: Compiler-backed analysis
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Check analyzer configuration DSL
        shell: pwsh
        run: .\vxs_kts\gradlew.bat -p VisualAnalyzer spotlessCheck test

      - name: Build Visual Analyzer
        shell: pwsh
        working-directory: xs
        run: cabal build visual-analyzer

      - name: Test Visual Analyzer
        shell: pwsh
        working-directory: xs
        run: cabal test visual-analyzer-tests

      - name: Check package metadata
        shell: pwsh
        working-directory: VisualAnalyzer
        run: cabal check

      - name: Check patch hygiene
        shell: pwsh
        run: git diff --check
