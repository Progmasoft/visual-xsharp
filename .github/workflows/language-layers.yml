name: Language Layers

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: language-layers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-layers:
    name: Kotlin, Haskell, and Rust
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Install Rust nightly
        shell: pwsh
        run: rustup toolchain install nightly-2026-07-10 --profile default

      - name: Check Kotlin project runtime
        shell: pwsh
        run: .\xs_kts\gradlew.bat -p xs_kts check

      - name: Build Haskell compiler layers
        shell: pwsh
        working-directory: xs
        run: cabal build all

      - name: Test Haskell compiler layers
        shell: pwsh
        working-directory: xs
        run: cabal test all

      - name: Check Haskell package metadata
        shell: pwsh
        working-directory: xs/haskell/visual-xsharp-compiler
        run: cabal check

      - name: Check Rust formatting
        shell: pwsh
        run: cargo +nightly-2026-07-10 fmt --manifest-path xslang/Cargo.toml --check

      - name: Test Rust compiler core
        shell: pwsh
        run: cargo +nightly-2026-07-10 test --manifest-path xslang/Cargo.toml

      - name: Check Rust lints
        shell: pwsh
        run: cargo +nightly-2026-07-10 clippy --manifest-path xslang/Cargo.toml -- -D warnings

      - name: Check patch hygiene
        shell: pwsh
        run: git diff --check
