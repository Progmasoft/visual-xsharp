name: Language Layers

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: language-layers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-layers:
    name: Project DSL and compiler
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Check Kotlin project runtime
        shell: pwsh
        run: .\ProjectSystem\gradlew.bat -p ProjectSystem check

      - name: Build Haskell compiler layers
        shell: pwsh
        working-directory: Compiler
        run: cabal build visual-xsharp-compiler

      - name: Test Haskell compiler layers
        shell: pwsh
        working-directory: Compiler
        run: cabal test visual-xsharp-compiler-tests

      - name: Check Haskell package metadata
        shell: pwsh
        run: |
          $packageDirectories = @(
            "Compiler/Haskell/Syntax",
            "Compiler/Haskell/Frontend",
            "Compiler/Haskell/Core",
            "Compiler/Haskell/Driver"
          )
          foreach ($directory in $packageDirectories) {
            Push-Location $directory
            try {
              cabal check
              if ($LASTEXITCODE -ne 0) {
                throw "cabal check failed for $directory"
              }
            } finally {
              Pop-Location
            }
          }

      - name: Check patch hygiene
        shell: pwsh
        run: git diff --check
