name: Linter

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: visual-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: Kotlin DSL and linter
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Check linter configuration DSL
        shell: pwsh
        run: .\ProjectSystem\gradlew.bat -p Linter spotlessCheck test

      - name: Build Visual Linter
        shell: pwsh
        working-directory: Compiler
        run: cabal build visual-linter

      - name: Test Visual Linter
        shell: pwsh
        working-directory: Compiler
        run: cabal test visual-linter-tests

      - name: Check package metadata
        shell: pwsh
        working-directory: Linter
        run: cabal check

      - name: Check patch hygiene
        shell: pwsh
        run: git diff --check
