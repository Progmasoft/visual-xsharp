name: Haskell Coverage

on:
  pull_request:
  push:

permissions:
  contents: read
  id-token: write

concurrency:
  group: haskell-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-coverage:
    name: Frontend LCOV
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Test Haskell frontend with HPC
        shell: pwsh
        working-directory: xs
        run: cabal test all --enable-coverage --test-show-details=direct

      - name: Convert HPC data to LCOV
        shell: pwsh
        working-directory: xs
        run: |
          $toolVersion = "0.6.4.1"
          $expectedHash = "9805651928db5c168a453ae09dd26113c7fc9816314b7268f1d1a71f7196f55f"
          $tool = Join-Path $env:RUNNER_TEMP "hpc-codecov-$toolVersion.exe"
          $reportDirectory = Join-Path $PWD "coverage"
          $report = Join-Path $reportDirectory "haskell-frontend.lcov"

          curl.exe -L --fail --retry 4 --retry-delay 3 `
            -o $tool `
            "https://github.com/8c6794b6/hpc-codecov/releases/download/v$toolVersion/hpc-codecov-Windows-X64.exe"

          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tool).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "hpc-codecov SHA-256 mismatch: $actualHash"
          }

          New-Item -ItemType Directory -Force $reportDirectory | Out-Null
          & $tool -r . -x Main -x SourceSetTests -f lcov -o $report cabal:compiler-layer-tests
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $report)) {
            throw "hpc-codecov did not produce the expected LCOV report"
          }

      - name: Upload Haskell frontend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          plugins: noop
          files: ./xs/coverage/haskell-frontend.lcov
          flags: haskell-frontend
          name: haskell-frontend
